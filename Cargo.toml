[package]
name = "winoxit"
version = "1.0.0"
edition = "2021"
authors = ["WinoxIT Core Team"]
description = "WinoxIT — High-Performance Native Rust Windows IT & Hardware Engineering Suite"

[lib]
name = "winoxit_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
