<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#DD2476" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E54C8" />
      <stop offset="100%" stop-color="#8F94FB" />
    </linearGradient>
    <linearGradient id="corePlanet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998E" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>
  </defs>
  <!-- Dark Circular Backdrop with subtle halo -->
  <circle cx="128" cy="128" r="112" fill="#0B0F19"/>
  <!-- Orbit 1 (Slanted Diagonal 45°) -->
  <ellipse cx="128" cy="128" rx="90" ry="32" transform="rotate(-45 128 128)" 
           fill="none" stroke="url(#orbitGrad1)" stroke-width="14" stroke-linecap="round"/>
  <!-- Orbit 2 (Slanted Diagonal +45° forming X) -->
  <ellipse cx="128" cy="128" rx="90" ry="32" transform="rotate(45 128 128)" 
           fill="none" stroke="url(#orbitGrad2)" stroke-width="14" stroke-linecap="round"/>
  <!-- Glowing Center Hardware Core -->
  <circle cx="128" cy="128" r="30" fill="url(#corePlanet)" stroke="#ffffff" stroke-width="6"/>
  <circle cx="128" cy="128" r="10" fill="#ffffff"/>
  <!-- Satellite nodes representing endpoints -->
  <circle cx="64" cy="64" r="10" fill="#FF512F"/>
  <circle cx="192" cy="192" r="10" fill="#DD2476"/>
  <circle cx="192" cy="64" r="10" fill="#8F94FB"/>
  <circle cx="64" cy="192" r="10" fill="#4E54C8"/>
</svg>
