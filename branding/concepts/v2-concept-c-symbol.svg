<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Dark Terminal Rounded Base -->
  <rect x="28" y="28" width="200" height="200" rx="44" fill="url(#bgDark)"/>
  <!-- Winged W-Shape in Electric Gradient -->
  <path d="M60 84 L92 188 L128 136 L164 188 L196 84" 
        fill="none" stroke="url(#matrixGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyberGlow)"/>
  <!-- Glowing Target/Pulse Indicator -->
  <circle cx="128" cy="80" r="16" fill="url(#electricGrad)"/>
  <circle cx="128" cy="80" r="26" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6,4" opacity="0.8"/>
</svg>
